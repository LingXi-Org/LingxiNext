name = "LingxiNext"
language = "zh-CN"
layout = "wide"
default_sidebar_state = "open"
confirm_new_chat = true
cot = "full"
description = "基于 LingxiGraph 的安全多智能体编排平台"

[[UI.header_links]]
name = "Orchestration"
display_name = "编排管理"
icon_url = "/favicon"
