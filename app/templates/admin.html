<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="csrf-token" content="{{ csrf_token }}" />
    <meta name="current-user" content="{{ username }}" />
    <title>LingxiNext 控制台</title>
    <link rel="stylesheet" href="/admin-static/admin.css" />
  </head>
  <body>
    <div class="app" id="app">
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="#/dashboard">
          <span class="brand-mark">灵</span>
          <span class="brand-text"><strong>LingxiNext</strong><small>编排控制台</small></span>
        </a>
        <nav class="nav" aria-label="主导航">
          <a class="nav-item" href="#/dashboard" data-route="dashboard">
            <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3zm0 8h8v-6H3zm10 0h8V11h-8zm0-18v6h8V3z"/></svg>
            总览
          </a>
          <a class="nav-item" href="#/orchestrations" data-route="orchestrations">
            <svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 1 1 4 0 2 2 0 0 1-4 0Zm12 0a2 2 0 1 1 4 0 2 2 0 0 1-4 0ZM4 19a2 2 0 1 1 4 0 2 2 0 0 1-4 0Zm12 0a2 2 0 1 1 4 0 2 2 0 0 1-4 0ZM7.5 6.2 16 10m-8.5 7.8L16 14M6 7v10m12-10v10" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
            智能体编排
          </a>
          <a class="nav-item" href="#/agents" data-route="agents">
            <svg viewBox="0 0 24 24"><path d="M12 3a2 2 0 0 1 2 2v1h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h3V5a2 2 0 0 1 2-2Zm-3.5 8a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Zm7 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Z"/></svg>
            智能体
          </a>
          <a class="nav-item" href="#/connections" data-route="connections">
            <svg viewBox="0 0 24 24"><path d="M10.6 13.4a4 4 0 0 1 0-5.6l3-3a4 4 0 1 1 5.6 5.6l-1.6 1.6m-4.2-1.4a4 4 0 0 1 0 5.6l-3 3a4 4 0 0 1-5.6-5.6l1.6-1.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            Coze 连接
          </a>
          <a class="nav-item" href="#/sessions" data-route="sessions">
            <svg viewBox="0 0 24 24"><path d="M4 4h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-6l-4 4v-4H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Zm3 5h10M7 12h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            会话监控
          </a>
          <a class="nav-item" href="#/users" data-route="users">
            <svg viewBox="0 0 24 24"><path d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm-7 9a7 7 0 0 1 14 0zm14.5-9.2a3.5 3.5 0 0 0 0-6.6M22 20a6.5 6.5 0 0 0-4-5.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            用户
          </a>
          <a class="nav-item" href="#/audit" data-route="audit">
            <svg viewBox="0 0 24 24"><path d="M12 8v4l3 2m6-2a9 9 0 1 1-9-9 9 9 0 0 1 9 9Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            审计日志
          </a>
        </nav>
        <div class="sidebar-foot">
          <div class="me">
            <span class="avatar" id="me-avatar"></span>
            <span class="me-name" id="me-name">{{ username }}</span>
          </div>
          <a class="button subtle small block" href="/">返回聊天</a>
        </div>
      </aside>
      <main class="main" id="view" tabindex="-1"></main>
    </div>

    <div id="editor-root" class="editor-root" hidden></div>
    <div id="modal-root"></div>
    <div id="toast-root" class="toast-root" aria-live="polite"></div>

    <script type="module" src="/admin-static/admin/main.js"></script>
  </body>
</html>
