[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lingxinext"
version = "0.1.0"
description = "Safe, versioned LingxiGraph orchestration hosted by the stock Chainlit UI."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "argon2-cffi>=23.1,<26",
  "asyncpg>=0.30,<1",
  "chainlit==2.11.1",
  "cryptography>=44,<47",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "lingxigraph[coze,postgres]",
  "psutil>=5.9,<8",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.8,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy[asyncio]>=2.0.38,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.11,<1",
]

[tool.uv.sources]
lingxigraph = { path = "vendor/LingxiGraph", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "ASYNC"]
ignore = ["E501", "B008", "ASYNC109", "ASYNC110"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
